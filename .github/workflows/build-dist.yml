name: Build dist branch

# ⏹ RETIRED — this repository no longer builds or publishes anything.
#
# This job force-pushed a `dist` branch as an alternative consumption route. It
# has no consumer: `app`, `storefront` and `mobile` each pin an exact npm version
# of `sinfactura-types`, none a git ref (verified before disabling), so taking it
# down carries no consumer risk. The package now builds and publishes from
# `sinfactura/api` (`.github/workflows/publish-types.yml`).
#
# The `push` trigger is removed and the job is `if: false`, so neither a push nor a
# manual dispatch can run it. Note this job holds `contents: write` and force-pushes
# an orphan branch — leaving it dispatchable on an otherwise-archived repository is
# exactly the kind of live write path an archive is supposed to close.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-dist
  cancel-in-progress: false

jobs:
  build-and-publish:
    if: false # ⏹ retired — see the banner above
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack (uses Yarn from packageManager field)
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build types
        run: yarn build

      - name: Publish dist branch
        env:
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Stash the build output and the metadata files outside the git tree
          STAGE="$(mktemp -d)"
          cp -r dist "$STAGE/dist"
          cp package.json "$STAGE/package.json"
          [ -f LICENCE ] && cp LICENCE "$STAGE/LICENCE" || true
          [ -f LICENSE ] && cp LICENSE "$STAGE/LICENSE" || true
          [ -f README.md ] && cp README.md "$STAGE/README.md" || true

          # Replace working tree with an orphan branch — clean slate, no src/
          git checkout --orphan dist-build
          git rm -rf --quiet . > /dev/null 2>&1 || true
          # `git rm` only nukes tracked files; `git clean -fdx` removes
          # leftover gitignored content (dist/, node_modules/, tsbuildinfo).
          git clean -fdx > /dev/null 2>&1

          # Lay down only what consumers need (working tree is empty now)
          cp -r "$STAGE/dist" dist
          cp "$STAGE/package.json" package.json
          [ -f "$STAGE/LICENCE" ] && cp "$STAGE/LICENCE" LICENCE
          [ -f "$STAGE/LICENSE" ] && cp "$STAGE/LICENSE" LICENSE
          [ -f "$STAGE/README.md" ] && cp "$STAGE/README.md" README.md

          # Commit and force-push to the `dist` branch (single-commit, force-pushed each run)
          git add -f .
          git commit -m "build: dist from $SOURCE_REF@${SOURCE_SHA:0:7}"
          git push --force origin dist-build:dist
