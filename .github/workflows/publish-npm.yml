name: Publish to npm

# Publishes to the npm registry on every push to main whose package.json
# version isn't on the registry yet (i.e. the `chore(release): X.Y.Z` bump
# commits — pushes without a bump are skipped by the guard, not failed).
# Auth is npm Trusted Publishing (OIDC): no NPM_TOKEN secret to store or
# rotate, and provenance is attached automatically. One-time counterpart
# setup lives on npmjs.com — see PUBLISHING.md § npm.

# ⏹ RETIRED — this repository no longer publishes `sinfactura-types`.
#
# The package is published from `sinfactura/api` (`.github/workflows/publish-types.yml`)
# since the contracts fold. Two live pipelines minting one version is a race npm
# resolves by rejecting the loser, so this one goes down BEFORE the first publish
# from there, never after.
#
# The `push` trigger is removed and the job is `if: false`, so neither a push nor a
# manual dispatch can publish. Do not re-enable it: the api workflow derives the
# next patch from the last `types/v*` tag cross-checked against the registry, and a
# publish from here would move the registry underneath that counter and wedge it —
# by design, loudly, but wedged.
#
# The file is kept rather than deleted so the history of how this package was
# published stays readable. Remove it with the repository archive.

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm Trusted Publishing (OIDC)

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    if: false # ⏹ retired — see the banner above
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Node 22 bundles npm 10; OIDC trusted publishing needs npm >= 11.5.1.
      # Pinned to the 11.x line: npm@12.0.0 (2026-07-08) self-installs a
      # broken tree on the runner (MODULE_NOT_FOUND: sigstore at publish).
      - name: Upgrade npm for OIDC support
        run: npm install -g npm@11

      - name: Skip when this version is already published
        id: guard
        run: |
          LOCAL="$(node -p "require('./package.json').version")"
          PUBLISHED="$(npm view sinfactura-types version 2>/dev/null || echo none)"
          echo "local=$LOCAL published=$PUBLISHED"
          if [ "$LOCAL" = "$PUBLISHED" ]; then
            echo "publish=no" >> "$GITHUB_OUTPUT"
          else
            echo "publish=yes" >> "$GITHUB_OUTPUT"
          fi

      - name: Enable Corepack (uses Yarn from packageManager field)
        if: steps.guard.outputs.publish == 'yes'
        run: corepack enable

      # prepublishOnly runs `tsc`, which needs the typescript devDependency.
      - name: Install dependencies
        if: steps.guard.outputs.publish == 'yes'
        run: yarn install --immutable

      - name: Publish
        if: steps.guard.outputs.publish == 'yes'
        run: npm publish
