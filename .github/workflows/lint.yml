name: Lint

# Enforces the local `sinfactura/no-issue-refs-in-comments` rule (and any future
# lint rules) on every PR and on pushes to main. This is the only CI gate that
# runs ESLint — the build-dist / publish-npm workflows only compile and publish.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack (uses Yarn from packageManager field)
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Lint
        run: yarn lint
